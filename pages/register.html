<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Create a Fieldnote Learning Centre student account for classes, materials, and progress updates."
    />
    <title>Create Account | Fieldnote Learning Centre</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css" />
    <link rel="stylesheet" href="../assets/css/rtl.css" />
  </head>
  <body class="auth-page">
    <main id="main-content" class="auth-shell">
      <section class="auth-panel register-panel">
        <div class="auth-form-card">
          <a class="brand" href="index.html" aria-label="Fieldnote Learning Centre home">
            <img class="brand-mark" src="../assets/images/favicon.svg" alt="" />
            <span class="brand-text">
              Fieldnote
              <span>Learning Centre</span>
            </span>
          </a>
          <h1>Create your account.</h1>
          <p>Connect your grade, contact email, and password to the student portal.</p>
          <form class="form-grid two-col" data-register-form novalidate>
            <div class="field">
              <label for="reg-name">Student name</label>
              <input id="reg-name" name="name" placeholder="Enter student name" autocomplete="name" required />
              <span class="field-error" data-error-for="reg-name"></span>
            </div>
            <div class="field">
              <label for="reg-grade">Grade</label>
              <select id="reg-grade" name="grade" required>
                <option value="">Choose grade</option>
                <option>Grade 6–8</option>
                <option>Grade 9–10</option>
                <option>Grade 11–12</option>
              </select>
              <span class="field-error" data-error-for="reg-grade"></span>
            </div>
            <div class="field full">
              <label for="reg-email">Email</label>
              <input
                id="reg-email"
                name="email"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
              />
              <span class="field-error" data-error-for="reg-email"></span>
            </div>
            <div class="field full">
              <label for="reg-password">Password</label>
              <div class="password-wrap">
                <input
                  id="reg-password"
                  name="password"
                  type="password"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  required
                />
                <button class="password-toggle" type="button" data-password-toggle>Show</button>
              </div>
              <span class="field-error" data-error-for="reg-password"></span>
            </div>
            <div class="full">
              <button class="btn" type="submit">
                Create Account
                <span aria-hidden="true">→</span>
              </button>
              <div class="form-message" role="status">Account details accepted. Returning to Sign In…</div>
            </div>
          </form>
          <p class="auth-switch">
            Already registered?
            <a class="text-link" href="login.html">Sign In</a>
          </p>
          <a class="text-link auth-home" href="index.html">← Home</a>
        </div>
      </section>
    </main>
    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script src="../assets/js/main.js" defer></script>
  </body>
</html>
